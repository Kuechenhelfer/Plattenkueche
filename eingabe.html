<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Manager - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-6 font-sans">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-8 mt-4">Song Management Dashboard</h1>

        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-bold mb-4">Neuen Song hinzufügen</h2>
            <div class="flex flex-col md:flex-row gap-4">
                <input type="text" id="new-title" placeholder="Songtitel (z.B. Leiser)" class="flex-1 border border-gray-300 p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="text" id="new-artist" placeholder="Künstler (z.B. Lea)" class="flex-1 border border-gray-300 p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="addSong()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition">
                    Speichern
                </button>
            </div>
            <p id="add-error" class="text-red-500 mt-2 hidden text-sm">Bitte Titel und Künstler ausfüllen.</p>
        </div>

        <div class="bg-red-50 p-6 rounded-lg shadow-md mb-8 border border-red-200 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h2 class="text-xl font-bold text-red-700">Admin-Aktionen</h2>
                <p class="text-red-600 text-sm">Votes zurücksetzen oder die gesamte Liste leeren.</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-3">
                <button onclick="resetAllVotes()" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-4 rounded transition">
                    Alle Votes auf 0
                </button>
                <button onclick="deleteAllSongs()" class="bg-red-700 hover:bg-red-800 text-white font-bold py-2 px-4 rounded transition shadow-lg">
                    🗑️ Alle Songs löschen
                </button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-bold mb-4">Aktuelle Songs (Live-Übersicht)</h2>
            <div id="admin-song-list" class="space-y-4">
                <p class="text-gray-500">Lade Daten aus Firebase...</p>
            </div>
        </div>
    </div>

    <script>
        // Deine persönliche Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyB86TrxWC9rmuycZHIPWKVT8rk8kCmVEOw",
            authDomain: "plattenkueche-9eec1.firebaseapp.com",
            databaseURL: "https://plattenkueche-9eec1-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "plattenkueche-9eec1",
            storageBucket: "plattenkueche-9eec1.firebasestorage.app",
            messagingSenderId: "171239724797",
            appId: "1:171239724797:web:e298b93b43bf5d2bbf1094",
            measurementId: "G-S2LS9HE0G8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const adminSongListDiv = document.getElementById('admin-song-list');

        // Echtzeit-Listener für die Liste
        db.ref('songs').on('value', (snapshot) => {
            const data = snapshot.val();
            adminSongListDiv.innerHTML = '';

            if(data) {
                Object.keys(data).forEach(songId => {
                    const song = data[songId];
                    
                    const row = document.createElement('div');
                    row.className = "flex flex-col md:flex-row justify-between items-center bg-gray-50 p-4 border border-gray-200 rounded gap-4";
                    
                    row.innerHTML = `
                        <div class="flex-1 w-full">
                            <input type="text" id="title-${songId}" value="${song.title}" class="w-full border border-gray-300 p-1 rounded mb-1 font-bold text-lg">
                            <input type="text" id="artist-${songId}" value="${song.artist}" class="w-full border border-gray-300 p-1 rounded text-gray-600">
                        </div>
                        <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-end">
                            <span class="bg-orange-100 text-orange-800 font-bold py-1 px-3 rounded-full">
                                ${song.votes} Votes
                            </span>
                            <div class="flex gap-2">
                                <button onclick="updateSong('${songId}')" class="bg-green-500 hover:bg-green-600 text-white text-sm py-1 px-3 rounded transition">
                                    Ändern
                                </button>
                                <button onclick="deleteSong('${songId}')" class="bg-gray-400 hover:bg-gray-500 text-white text-sm py-1 px-3 rounded transition">
                                    Löschen
                                </button>
                            </div>
                        </div>
                    `;
                    adminSongListDiv.appendChild(row);
                });
            } else {
                adminSongListDiv.innerHTML = '<p class="text-gray-500">Aktuell keine Songs in der Datenbank.</p>';
            }
        });

        // Funktion: Neuen Song hinzufügen
        window.addSong = function() {
            const titleInput = document.getElementById('new-title').value.trim();
            const artistInput = document.getElementById('new-artist').value.trim();
            const errorMsg = document.getElementById('add-error');

            if (!titleInput || !artistInput) {
                errorMsg.classList.remove('hidden');
                return;
            }
            errorMsg.classList.add('hidden');

            const newSongId = 'song_' + Date.now();

            db.ref('songs/' + newSongId).set({
                title: titleInput,
                artist: artistInput,
                votes: 0
            }).then(() => {
                document.getElementById('new-title').value = '';
                document.getElementById('new-artist').value = '';
            });
        };

        // Funktion: Bestehenden Song bearbeiten
        window.updateSong = function(songId) {
            const newTitle = document.getElementById('title-' + songId).value;
            const newArtist = document.getElementById('artist-' + songId).value;

            db.ref('songs/' + songId).update({
                title: newTitle,
                artist: newArtist
            }).then(() => {
                alert('Song aktualisiert!');
            });
        };

        // Funktion: Einzelnen Song komplett löschen
        window.deleteSong = function(songId) {
            if(confirm('Diesen Song wirklich aus der Liste löschen?')) {
                db.ref('songs/' + songId).remove();
            }
        };

        // Funktion: Alle Votes auf 0 setzen UND neue Runde starten
        window.resetAllVotes = function() {
            if(confirm('Bist du sicher? Alle bisherigen Stimmen werden auf 0 gesetzt und das Voting wird für alle Handys neu gestartet!')) {
                db.ref('songs').once('value', snapshot => {
                    const data = snapshot.val();
                    const updates = {};
                    
                    // Alle Stimmen auf 0
                    if(data) {
                        Object.keys(data).forEach(songId => {
                            updates['songs/' + songId + '/votes'] = 0;
                        });
                    }
                    
                    // Eine neue Runden-ID setzen (Zeitstempel)
                    updates['currentRound'] = Date.now();
                    
                    db.ref().update(updates).then(() => {
                        alert('Erfolgreich zurückgesetzt! Eine neue Voting-Runde hat begonnen.');
                    });
                });
            }
        };

        // NEUE Funktion: ALLE Songs komplett löschen
        window.deleteAllSongs = function() {
            if(confirm('ACHTUNG: Willst du wirklich ALLE Songs komplett löschen? Das kann nicht rückgängig gemacht werden!')) {
                db.ref('songs').remove().then(() => {
                    alert('Die komplette Song-Liste wurde erfolgreich gelöscht!');
                });
            }
        };
    </script>
</body>
</html>
