<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song des Abends - Voting</title>
    <!-- Tailwind CSS für einfaches, modernes Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6 font-sans">

    <div class="max-w-md mx-auto">
        <h1 class="text-3xl font-bold text-center text-orange-500 mb-8 mt-4">Song des Abends 🎵</h1>
        <p class="text-center text-gray-400 mb-8">Stimme für deinen Favoriten ab!</p>

        <div id="song-list" class="space-y-4">
            <!-- Songs werden hier per JavaScript geladen -->
            <p class="text-center text-gray-500">Lade Songs...</p>
        </div>
        
        <div id="voted-message" class="hidden mt-8 p-4 bg-green-900 text-green-300 rounded-lg text-center font-bold">
            Danke für deine Stimme!
        </div>
    </div>

    <script>
        // HIER DEINE FIREBASE CONFIG EINTRAGEN
        const firebaseConfig = {
            apiKey: "DEIN_API_KEY",
            authDomain: "DEINE_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://DEINE_PROJECT_ID-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "DEINE_PROJECT_ID",
            storageBucket: "DEINE_PROJECT_ID.appspot.com",
            messagingSenderId: "DEINE_MESSAGING_ID",
            appId: "DEINE_APP_ID"
        };

        // Firebase initialisieren
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const songListDiv = document.getElementById('song-list');
        const votedMessageDiv = document.getElementById('voted-message');

        // Prüfen, ob der Nutzer schon abgestimmt hat
        let hasVoted = localStorage.getItem('voted') === 'true';

        if (hasVoted) {
            votedMessageDiv.classList.remove('hidden');
        }

        // Initiale Beispieldaten anlegen (nur wenn Datenbank leer ist)
        function initDummyData() {
            db.ref('songs').once('value', snapshot => {
                if (!snapshot.exists()) {
                    db.ref('songs').set({
                        "song1": { title: "Schon wieder Juni", artist: "Schattenflieger", votes: 0 },
                        "song2": { title: "Ein anderer Beat", artist: "TikTok Allstars", votes: 0 }
                    });
                }
            });
        }
        initDummyData();

        // Songs live aus der Datenbank laden
        db.ref('songs').on('value', (snapshot) => {
            const data = snapshot.val();
            songListDiv.innerHTML = ''; // Liste leeren

            if(data) {
                Object.keys(data).forEach(songId => {
                    const song = data[songId];
                    
                    // HTML für jeden Song generieren
                    const songCard = document.createElement('div');
                    songCard.className = "bg-gray-800 p-4 rounded-lg flex justify-between items-center shadow-lg border border-gray-700";
                    
                    // Button ist deaktiviert, wenn schon abgestimmt wurde
                    const btnClass = hasVoted 
                        ? "bg-gray-600 cursor-not-allowed text-gray-400 py-2 px-4 rounded font-bold" 
                        : "bg-orange-500 hover:bg-orange-600 text-white py-2 px-4 rounded font-bold transition";

                    songCard.innerHTML = `
                        <div>
                            <h2 class="text-xl font-bold">${song.title}</h2>
                            <p class="text-gray-400 text-sm">${song.artist}</p>
                        </div>
                        <button onclick="vote('${songId}')" class="${btnClass}" ${hasVoted ? 'disabled' : ''}>
                            Voten
                        </button>
                    `;
                    songListDiv.appendChild(songCard);
                });
            }
        });

        // Abstimm-Funktion
        window.vote = function(songId) {
            if (hasVoted) return;

            // Transaktion: Verhindert Konflikte, wenn 2 Leute in derselben Millisekunde klicken
            db.ref('songs/' + songId + '/votes').transaction((currentVotes) => {
                return (currentVotes || 0) + 1;
            }, (error, committed) => {
                if (committed) {
                    localStorage.setItem('voted', 'true');
                    hasVoted = true;
                    votedMessageDiv.classList.remove('hidden');
                    // Liste zwingen, sich neu zu zeichnen (Buttons deaktivieren)
                    db.ref('songs').once('value', snapshot => db.ref('songs').set(snapshot.val()));
                }
            });
        };
    </script>
</body>
</html>
