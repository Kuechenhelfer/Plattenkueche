<script>
        // Deine persönliche Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyB86TrxWC9rmuycZHIPWKVT8rk8kCmVEOw",
            authDomain: "plattenkueche-9eec1.firebaseapp.com",
            databaseURL: "https://plattenkueche-9eec1-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "plattenkueche-9eec1",
            storageBucket: "plattenkueche-9eec1.firebasestorage.app",
            messagingSenderId: "171239724797",
            appId: "1:171239724797:web:e298b93b43bf5d2bbf1094",
            measurementId: "G-S2LS9HE0G8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const songListDiv = document.getElementById('song-list');
        const votedMessageDiv = document.getElementById('voted-message');

        let currentRound = "";
        let hasVoted = false;

        // Lausche auf die aktuelle Runde
        db.ref('currentRound').on('value', (snapshot) => {
            const val = snapshot.val() || "init";
            currentRound = val;
            
            // Prüfen, ob für DIESE Runde schon abgestimmt wurde
            hasVoted = localStorage.getItem('voted_round_' + currentRound) === 'true';

            if (hasVoted) {
                votedMessageDiv.classList.remove('hidden');
            } else {
                votedMessageDiv.classList.add('hidden');
            }
            
            // Songs neu zeichnen, um Buttons zu aktivieren/deaktivieren
            renderSongs();
        });

        // Funktion zum Zeichnen der Songliste
        function renderSongs() {
            db.ref('songs').once('value', (snapshot) => {
                const data = snapshot.val();
                songListDiv.innerHTML = ''; 

                if(data) {
                    Object.keys(data).forEach(songId => {
                        const song = data[songId];
                        const songCard = document.createElement('div');
                        songCard.className = "bg-gray-800 p-4 rounded-lg flex justify-between items-center shadow-lg border border-gray-700";
                        
                        const btnClass = hasVoted 
                            ? "bg-gray-600 cursor-not-allowed text-gray-400 py-2 px-4 rounded font-bold" 
                            : "bg-orange-500 hover:bg-orange-600 text-white py-2 px-4 rounded font-bold transition";

                        songCard.innerHTML = `
                            <div>
                                <h2 class="text-xl font-bold">${song.title}</h2>
                                <p class="text-gray-400 text-sm">${song.artist}</p>
                            </div>
                            <button onclick="vote('${songId}')" class="${btnClass}" ${hasVoted ? 'disabled' : ''}>
                                Voten
                            </button>
                        `;
                        songListDiv.appendChild(songCard);
                    });
                } else {
                    songListDiv.innerHTML = '<p class="text-center text-gray-500">Noch keine Songs verfügbar.</p>';
                }
            });
        }

        // Songs auch live aktualisieren, wenn sich Stimmen ändern
        db.ref('songs').on('value', () => {
            renderSongs();
        });

        // Abstimm-Funktion
        window.vote = function(songId) {
            if (hasVoted) return;

            db.ref('songs/' + songId + '/votes').transaction((currentVotes) => {
                return (currentVotes || 0) + 1;
            }, (error, committed) => {
                if (committed) {
                    // Sperre NUR für diese spezifische Runde speichern
                    localStorage.setItem('voted_round_' + currentRound, 'true');
                    hasVoted = true;
                    votedMessageDiv.classList.remove('hidden');
                    renderSongs();
                }
            });
        };
    </script>
